<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal | ZAHAATI FREIGHTCARGO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">ZAHAATI<span>FREIGHT</span></a>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="main-search" placeholder="Search shipments, quotes...">
                <button id="search-action-btn">SEARCH</button>
                <div id="search-suggestions" class="search-suggestions"></div>
            </div>
            <div class="header-nav">
                <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
                <!-- Account Dropdown moved to the right and updated -->
                <div class="nav-item dropdown">
                    <i class="far fa-user"></i>
                    <span>Account <i class="fas fa-chevron-down" style="font-size: 10px;"></i></span>
                    <div class="dropdown-content">
                        <a href="dashboard.html"><i class="far fa-user"></i> Profile</a>
                        <a href="dashboard.html"><i class="fas fa-file-invoice-dollar"></i> Active Quotes</a>
                        <hr>
                        <a href="index.html" style="color: red;"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="main-grid">
            <aside class="sidebar-menu">
                <div style="padding: 10px 16px; font-weight: bold; color: var(--navy);">MY PORTAL</div>
                <a href="#" class="active"><i class="fas fa-box"></i> Active Shipments</a>
                <a href="#"><i class="fas fa-file-invoice"></i> My Quotes</a>
                <a href="#"><i class="fas fa-address-book"></i> Addresses</a>
                <a href="#"><i class="fas fa-user-cog"></i> Account Settings</a>
                <hr>
                <a href="contact.html"><i class="fas fa-headset"></i> Help Center</a>
            </aside>

            <section class="section-white dashboard-panel">
                <div class="section-title-bar blue">
                    <div>
                        <span class="eyebrow">CLIENT PORTAL</span>
                        <h2>ACTIVE SHIPMENTS</h2>
                    </div>
                    <span class="dashboard-sync" id="dashboard-sync">Syncing...</span>
                </div>

                <div id="shipment-list" class="shipment-list">
                    <div class="dashboard-state"><i class="fas fa-circle-notch fa-spin"></i> Loading shipment data...</div>
                </div>
            </section>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="index.html" class="m-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="dashboard.html" class="m-nav-item active"><i class="fas fa-box"></i><span>Portal</span></a>
        <a href="#" class="m-nav-item modal-trigger"><i class="fas fa-search-location"></i><span>Track</span></a>
        <a href="contact.html" class="m-nav-item"><i class="fas fa-headset"></i><span>Help</span></a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
